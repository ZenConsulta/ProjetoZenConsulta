<!--
  busca-medicos.html  ->  servido pelo MainViewController em GET /buscar-medico
  A lista "medicos" (List<Map<String,String>>) vem do Model e é percorrida
  com th:each, gerando um card por médico. Cada card linka para
  /medico/{id}, que é a página de perfil (@PathVariable no controller).
-->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: head}"></head>
<body class="bg-background text-on-surface">

<aside th:replace="~{baseLayout :: sidebar('buscar-medico')}"></aside>
<header th:replace="~{baseLayout :: topbar('Encontrar um Médico')}"></header>

<main class="md:ml-64 pt-24 pb-12 px-margin-desktop">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Filtros (estáticos nesta versão de estudo; poderiam virar um formulário
             enviando @RequestParam para este mesmo /buscar-medico) -->
        <aside class="lg:col-span-3 bg-surface-container-lowest border border-outline-variant rounded-xl p-6 h-fit">
            <h3 class="text-xs uppercase text-secondary mb-3">Especialidade</h3>
            <label class="flex items-center gap-2 mb-2">
                <input type="checkbox" checked class="rounded"/> <span>Cardiologia</span>
            </label>
            <label class="flex items-center gap-2 mb-2">
                <input type="checkbox" class="rounded"/> <span>Dermatologia</span>
            </label>
            <label class="flex items-center gap-2">
                <input type="checkbox" class="rounded"/> <span>Pediatria</span>
            </label>
            <h3 class="text-xs uppercase text-secondary mt-6 mb-3">Avaliação Mínima</h3>
            <p class="text-sm text-secondary">4.0 ou mais ★★★★</p>
        </aside>

        <!-- Resultados -->
        <section class="lg:col-span-9 space-y-4">
            <div class="flex justify-between items-center">
                <!-- ${totalEncontrados} vem direto do Model -->
                <h3 class="text-xl font-semibold" th:text="${totalEncontrados} + ' Especialistas Encontrados'">
                    Especialistas Encontrados
                </h3>
            </div>

            <!-- th:each="medico : ${medicos}" -> repete este bloco para cada item da lista -->
            <div th:each="medico : ${medicos}"
                 class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 flex flex-col sm:flex-row gap-6 hover:shadow-lg transition-shadow">
                <div class="w-24 h-24 rounded-lg bg-surface-container-high flex items-center justify-center flex-shrink-0">
                    <span class="material-symbols-outlined text-4xl text-primary">stethoscope</span>
                </div>
                <div class="flex-1 flex flex-col justify-between">
                    <div class="flex justify-between items-start">
                        <div>
                            <!-- Acesso a campos do Map com ${medico.nome}, ${medico.especialidade}... -->
                            <h4 class="text-lg font-semibold" th:text="${medico.nome}">Nome do Médico</h4>
                            <p class="text-sm text-secondary" th:text="${medico.especialidade} + ' • ' + ${medico.local}">
                                Especialidade • Local
                            </p>
                        </div>
                        <span class="flex items-center gap-1 bg-surface-container px-2 py-1 rounded-full text-sm font-bold">
                            <span class="material-symbols-outlined text-[16px] text-tertiary">star</span>
                            <span th:text="${medico.nota}">4.9</span>
                        </span>
                    </div>
                    <div class="mt-4 flex items-center justify-between border-t border-outline-variant pt-3">
                        <span class="text-sm">Vagas disponíveis esta semana</span>
                        <!--
                            th:href="@{/medico/{id}(id=${medico.id})}"
                            monta a URL /medico/1, /medico/2... a partir do id do médico atual do loop.
                        -->
                        <a th:href="@{/medico/{id}(id=${medico.id})}"
                           class="px-6 py-2 bg-primary text-on-primary rounded-lg text-sm font-bold hover:opacity-90">
                            Ver Perfil
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<footer th:replace="~{baseLayout :: footer}" class="md:ml-64"></footer>

</body>
</html>
