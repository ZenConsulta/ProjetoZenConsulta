<!--
  prontuarios.html  ->  servido pelo MainViewController em GET /prontuarios
  Igual às demais: só a estrutura da página + dados mock por enquanto.
-->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: head}"></head>
<body class="bg-background text-on-surface">

<aside th:replace="~{baseLayout :: sidebar('prontuarios')}"></aside>
<header th:replace="~{baseLayout :: topbar('Prontuários Médicos')}"></header>

<main class="md:ml-64 pt-24 pb-12 px-margin-desktop">

    <h1 class="text-2xl font-bold mb-6">Prontuários Médicos</h1>

    <div class="space-y-3">
        <!-- th:each percorre a lista "prontuarios" vinda do Model -->
        <div th:each="doc : ${prontuarios}"
             class="flex items-center justify-between bg-surface-container-lowest border border-outline-variant rounded-xl p-4">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-secondary">description</span>
                <span class="font-semibold" th:text="${doc.titulo}">Título do documento</span>
            </div>
            <span class="text-sm text-on-surface-variant" th:text="${doc.data}">Data</span>
        </div>
    </div>
</main>

<footer th:replace="~{baseLayout :: footer}" class="md:ml-64"></footer>

</body>
</html>
