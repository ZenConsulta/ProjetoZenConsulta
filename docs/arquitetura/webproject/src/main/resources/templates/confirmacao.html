
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: head}"></head>
<body class="bg-background text-on-surface">

<aside th:replace="~{baseLayout :: sidebar('confirmacao')}"></aside>
<header th:replace="~{baseLayout :: topbar('Confirmar Agendamento')}"></header>

<main class="md:ml-64 pt-24 pb-12 px-margin-desktop max-w-3xl">

    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-primary">Confirme seu agendamento</h1>
        <p class="text-on-surface-variant">Revise os detalhes antes da confirmação final.</p>
    </div>

    <section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6">
        <div class="flex items-center gap-3 mb-6">
            <div class="bg-secondary-container p-3 rounded-lg">
                <span class="material-symbols-outlined text-primary">calendar_today</span>
            </div>
            <div>
                <h2 class="text-xl font-semibold">Resumo do Agendamento</h2>
                
                <p class="text-xs uppercase text-secondary" th:text="'ID Ref: ' + ${refAgendamento}">ID Ref</p>
            </div>
        </div>

        <div class="space-y-3">
            <div class="flex justify-between border-b border-outline-variant py-2">
                <span class="text-secondary">Médico(a)</span>
               
                <span class="font-bold" th:text="${medico}">Nome do Médico</span>
            </div>
            <div class="flex justify-between border-b border-outline-variant py-2">
                <span class="text-secondary">Data</span>
                <span class="font-bold" th:text="${data}">Data</span>
            </div>
            <div class="flex justify-between py-2">
                <span class="text-secondary">Horário</span>
                <span class="font-bold" th:text="${horario}">Horário</span>
            </div>
        </div>
    </section>

    <div class="mt-6 space-y-3">
        <button class="w-full bg-primary-container text-on-primary-container py-3 rounded-xl font-bold hover:opacity-90 flex justify-center items-center gap-2">
            Confirmar Reserva <span class="material-symbols-outlined">arrow_forward</span>
        </button>
        <a th:href="@{/painel}" class="block w-full text-center bg-surface border border-outline-variant text-secondary py-3 rounded-xl font-bold hover:bg-surface-container-low">
            Cancelar e voltar ao Painel
        </a>
    </div>
</main>

<footer th:replace="~{baseLayout :: footer}" class="md:ml-64"></footer>

</body>
</html>
