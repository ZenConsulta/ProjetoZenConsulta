<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: head}"></head>
<body class="bg-background text-on-surface">

<aside th:replace="~{baseLayout :: sidebar('configuracoes')}"></aside>
<header th:replace="~{baseLayout :: topbar('Configurações')}"></header>

<main class="md:ml-64 pt-24 pb-12 px-margin-desktop max-w-xl">

    <h1 class="text-2xl font-bold mb-6">Configurações da Conta</h1>

    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 space-y-4">
        <div>
            <label class="block text-xs uppercase text-secondary mb-1">Nome</label>
            <input type="text" th:value="${nomePaciente}"
                   class="w-full border border-outline-variant rounded-lg p-2"/>
        </div>
        <div>
            <label class="block text-xs uppercase text-secondary mb-1">E-mail</label>
            <input type="email" th:value="${emailPaciente}"
                   class="w-full border border-outline-variant rounded-lg p-2"/>
        </div>
        <button class="bg-primary text-on-primary px-6 py-2 rounded-lg font-semibold" disabled>
            Salvar (em breve)
        </button>
    </div>
</main>

<footer th:replace="~{baseLayout :: footer}" class="md:ml-64"></footer>

</body>
</html>
