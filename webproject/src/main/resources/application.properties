# =====================================================================
# Configurações gerais da aplicação
# =====================================================================

spring.application.name=webproject

# Porta do servidor embutido (Tomcat). Padrão 8080.
server.port=8080

# Desliga o cache de templates do Thymeleaf em desenvolvimento,
# assim toda alteração no .html aparece sem precisar reiniciar a aplicação.
spring.thymeleaf.cache=false

# Arquivo de textos traduzíveis (i18n). Ver messages.properties.
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Textos usados nos templates via #{...} (Thymeleaf) ou @Value (Java)
app.title=ZenConsulta
app.contact=Fale Conosco
