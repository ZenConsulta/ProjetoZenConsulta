<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: head}"></head>
<body class="bg-background text-on-surface">
<nav th:replace="~{baseLayout :: adminNav('agendamentos')}"></nav>

<main class="px-margin-desktop py-8 max-w-xl">
    <h1 class="text-2xl font-bold mb-6">Solicitar Agendamento</h1>

    <form th:action="@{/agendamentos}" th:object="${agendamento}" method="post"
          class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 space-y-4">

        <div>
            <label class="block text-xs uppercase text-secondary mb-1">Paciente</label>
            <select th:field="*{pacienteId}" required class="w-full border border-outline-variant rounded-lg p-2">
                <option value="">Selecione...</option>
                <option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nome}">Paciente</option>
            </select>
        </div>
        <div>
            <label class="block text-xs uppercase text-secondary mb-1">Profissional</label>
            <select th:field="*{profissionalId}" required class="w-full border border-outline-variant rounded-lg p-2">
                <option value="">Selecione...</option>
                <option th:each="p : ${profissionais}" th:value="${p.id}" th:text="${p.nome} + ' - ' + ${p.especialidade}">Profissional</option>
            </select>
        </div>
        <div>
            <label class="block text-xs uppercase text-secondary mb-1">Horário disponível</label>
            <select th:field="*{slotAgendaId}" required class="w-full border border-outline-variant rounded-lg p-2">
                <option value="">Selecione...</option>
                <option th:each="s : ${slotsDisponiveis}" th:value="${s.id}"
                        th:text="${s.data} + ' às ' + ${s.horario} + ' (profissional id ' + ${s.profissionalId} + ')'">Horário</option>
            </select>
            <p class="text-xs text-on-surface-variant mt-1">Só aparecem aqui os horários com disponivel = true (RN02).</p>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-primary text-on-primary px-6 py-2 rounded-lg font-semibold">Solicitar</button>
            <a th:href="@{/agendamentos}" class="text-secondary px-6 py-2">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{baseLayout :: footer}"></footer>
</body>
</html>
