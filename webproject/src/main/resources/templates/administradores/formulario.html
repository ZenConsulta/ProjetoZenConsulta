<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: head}"></head>
<body class="bg-background text-on-surface">
<nav th:replace="~{baseLayout :: adminNav('administradores')}"></nav>

<main class="px-margin-desktop py-8 max-w-xl">
    <h1 class="text-2xl font-bold mb-6" th:text="${administrador.id} != null ? 'Editar Administrador' : 'Novo Administrador'">Novo Administrador</h1>

    <form th:action="${administrador.id} != null ? @{/administradores/{id}/editar(id=${administrador.id})} : @{/administradores}"
          th:object="${administrador}" method="post"
          class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6 space-y-4">

        <div>
            <label class="block text-xs uppercase text-secondary mb-1">Nome</label>
            <input type="text" th:field="*{nome}" required class="w-full border border-outline-variant rounded-lg p-2"/>
        </div>
        <div>
            <label class="block text-xs uppercase text-secondary mb-1">Email</label>
            <input type="email" th:field="*{email}" required class="w-full border border-outline-variant rounded-lg p-2"/>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-primary text-on-primary px-6 py-2 rounded-lg font-semibold">Salvar</button>
            <a th:href="@{/administradores}" class="text-secondary px-6 py-2">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{baseLayout :: footer}"></footer>
</body>
</html>
