<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: head}"></head>
<body class="bg-background text-on-surface">
<nav th:replace="~{baseLayout :: adminNav('slots')}"></nav>
<div th:replace="~{baseLayout :: mensagens}"></div>

<main class="px-margin-desktop py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Horários (Slots de Agenda)</h1>
        <a th:href="@{/slots/novo}" class="bg-primary text-on-primary px-4 py-2 rounded-lg font-semibold">+ Novo Horário</a>
    </div>

    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead class="bg-surface-container-low border-b border-outline-variant">
            <tr>
                <th class="px-6 py-3 text-xs uppercase text-secondary">Profissional</th>
                <th class="px-6 py-3 text-xs uppercase text-secondary">Data</th>
                <th class="px-6 py-3 text-xs uppercase text-secondary">Horário</th>
                <th class="px-6 py-3 text-xs uppercase text-secondary">Disponível</th>
                <th class="px-6 py-3 text-xs uppercase text-secondary">Ações</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-outline-variant">
            <tr th:each="s : ${slots}">
                <td class="px-6 py-3 font-semibold" th:text="${nomesProfissionais.get(s.profissionalId)}">Profissional</td>
                <td class="px-6 py-3 text-on-surface-variant" th:text="${s.data}">Data</td>
                <td class="px-6 py-3 text-on-surface-variant" th:text="${s.horario}">Horário</td>
                <td class="px-6 py-3">
                    <span th:if="${s.disponivel}" class="px-2 py-0.5 bg-primary-container text-on-primary-container text-[11px] font-bold rounded-full uppercase">Disponível</span>
                    <span th:unless="${s.disponivel}" class="px-2 py-0.5 bg-surface-container-high text-secondary text-[11px] font-bold rounded-full uppercase">Ocupado</span>
                </td>
                <td class="px-6 py-3">
                    <form th:action="@{/slots/{id}/excluir(id=${s.id})}" method="post" onsubmit="return confirm('Remover este horário?');">
                        <button type="submit" class="text-error text-sm font-semibold hover:underline">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(slots)}">
                <td colspan="5" class="px-6 py-6 text-center text-on-surface-variant">Nenhum horário cadastrado.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{baseLayout :: footer}"></footer>
</body>
</html>
