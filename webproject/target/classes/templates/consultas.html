<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: head}"></head>
<body class="bg-background text-on-surface">

<aside th:replace="~{baseLayout :: sidebar('consultas')}"></aside>
<header th:replace="~{baseLayout :: topbar('Minhas Consultas')}"></header>

<main class="md:ml-64 pt-24 pb-12 px-margin-desktop">

    <h1 class="text-2xl font-bold mb-6">Minhas Consultas</h1>

    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead class="bg-surface-container-low border-b border-outline-variant">
            <tr>
                <th class="px-6 py-3 text-xs uppercase text-secondary">Médico</th>
                <th class="px-6 py-3 text-xs uppercase text-secondary">Data</th>
                <th class="px-6 py-3 text-xs uppercase text-secondary">Status</th>
            </tr>
            </thead>

            <tbody class="divide-y divide-outline-variant">
            <tr th:each="consulta : ${consultas}" class="hover:bg-surface-bright">
                <td class="px-6 py-3 font-semibold" th:text="${consulta.medico}">Médico</td>
                <td class="px-6 py-3 text-on-surface-variant" th:text="${consulta.data}">Data</td>
                <td class="px-6 py-3">
                    <span class="px-2 py-0.5 bg-secondary-container text-on-secondary-container text-[11px] font-bold rounded-full uppercase"
                          th:text="${consulta.status}">Status</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/buscar-medico}" class="inline-block mt-6 text-primary font-semibold hover:underline">
        + Agendar nova consulta
    </a>
</main>

<footer th:replace="~{baseLayout :: footer}" class="md:ml-64"></footer>

</body>
</html>
