<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: head}"></head>
<body class="bg-background text-on-surface">
<nav th:replace="~{baseLayout :: adminNav('agendamentos')}"></nav>
<div th:replace="~{baseLayout :: mensagens}"></div>

<main class="px-margin-desktop py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Agendamentos</h1>
        <a th:href="@{/agendamentos/novo}" class="bg-primary text-on-primary px-4 py-2 rounded-lg font-semibold">+ Solicitar Agendamento</a>
    </div>

    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead class="bg-surface-container-low border-b border-outline-variant">
            <tr>
                <th class="px-6 py-3 text-xs uppercase text-secondary">Paciente</th>
                <th class="px-6 py-3 text-xs uppercase text-secondary">Profissional</th>
                <th class="px-6 py-3 text-xs uppercase text-secondary">Horário</th>
                <th class="px-6 py-3 text-xs uppercase text-secondary">Status</th>
                <th class="px-6 py-3 text-xs uppercase text-secondary">Operador</th>
                <th class="px-6 py-3 text-xs uppercase text-secondary">Ações</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-outline-variant">
            <tr th:each="ag : ${agendamentos}">
                <td class="px-6 py-3 font-semibold" th:text="${nomesPacientes.get(ag.pacienteId)}">Paciente</td>
                <td class="px-6 py-3 text-on-surface-variant" th:text="${nomesProfissionais.get(ag.profissionalId)}">Profissional</td>
                <td class="px-6 py-3 text-on-surface-variant" th:text="${horariosSlots.get(ag.slotAgendaId)}">Horário</td>
                <td class="px-6 py-3">
                    <span th:if="${ag.status.name() == 'PENDENTE'}" class="px-2 py-0.5 bg-surface-container-high text-secondary text-[11px] font-bold rounded-full uppercase">Pendente</span>
                    <span th:if="${ag.status.name() == 'CONFIRMADO'}" class="px-2 py-0.5 bg-primary-container text-on-primary-container text-[11px] font-bold rounded-full uppercase">Confirmado</span>
                    <span th:if="${ag.status.name() == 'CANCELADO'}" class="px-2 py-0.5 bg-error text-white text-[11px] font-bold rounded-full uppercase">Cancelado</span>
                </td>
                <td class="px-6 py-3 text-on-surface-variant" th:text="${ag.operadorResponsavelId != null} ? ${nomesOperadores.get(ag.operadorResponsavelId)} : '—'">Operador</td>
                <td class="px-6 py-3">
                    <div th:if="${ag.status.name() == 'PENDENTE'}" class="flex items-center gap-2">
                        <form th:action="@{/agendamentos/{id}/confirmar(id=${ag.id})}" method="post" class="flex items-center gap-2">
                            <select name="operadorId" required class="border border-outline-variant rounded-lg p-1 text-sm">
                                <option value="">Operador...</option>
                                <option th:each="o : ${operadores}" th:value="${o.id}" th:text="${o.nome}">Operador</option>
                            </select>
                            <button type="submit" class="text-primary text-sm font-semibold hover:underline">Confirmar</button>
                        </form>
                        <form th:action="@{/agendamentos/{id}/cancelar(id=${ag.id})}" method="post" onsubmit="return confirm('Cancelar este agendamento?');">
                            <button type="submit" class="text-error text-sm font-semibold hover:underline">Cancelar</button>
                        </form>
                    </div>
                    <form th:if="${ag.status.name() == 'CONFIRMADO'}" th:action="@{/agendamentos/{id}/cancelar(id=${ag.id})}" method="post" onsubmit="return confirm('Cancelar este agendamento?');">
                        <button type="submit" class="text-error text-sm font-semibold hover:underline">Cancelar</button>
                    </form>
                    <span th:if="${ag.status.name() == 'CANCELADO'}" class="text-xs text-on-surface-variant">—</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(agendamentos)}">
                <td colspan="6" class="px-6 py-6 text-center text-on-surface-variant">Nenhum agendamento cadastrado.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{baseLayout :: footer}"></footer>
</body>
</html>
