# =====================================================================
# Configurações gerais da aplicação
# =====================================================================

spring.application.name=webproject
server.port=8080

spring.thymeleaf.cache=false

spring.messages.basename=messages
spring.messages.encoding=UTF-8

app.title=ZenConsulta
app.contact=Fale Conosco

# =====================================================================
# Persistência (TR05) — Banco de dados H2 em memória
# =====================================================================
spring.datasource.url=jdbc:h2:mem:zenconsulta;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================================
# Tratamento de erros da API REST (TR07) — RFC 9457 (Problem Details)
# =====================================================================
# Habilita o suporte nativo do Spring a respostas de erro no formato
# "application/problem+json", conforme exigido pela RFC 9457.
spring.mvc.problemdetails.enabled=true

# =====================================================================
# Documentação da API (Swagger/OpenAPI via springdoc) — TR07
# =====================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
