<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{baseLayout :: head}"></head>
<body class="bg-background text-on-surface">

<main class="min-h-screen flex flex-col items-center justify-center text-center px-6">
    <span class="material-symbols-outlined text-6xl text-error mb-4">block</span>
    <h1 class="text-3xl font-bold mb-2">Não foi possível concluir</h1>
    <p class="text-on-surface-variant max-w-md mb-6" th:text="${mensagem}">
        Essa ação viola uma regra do sistema.
    </p>
    <a href="javascript:history.back()" class="bg-primary text-on-primary px-6 py-2 rounded-lg font-semibold">
        Voltar
    </a>
</main>

</body>
</html>
